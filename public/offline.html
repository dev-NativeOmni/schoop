<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — HafizPlus SchoolOS</title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=instrument-sans:400,600,700,800" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #060b14;
            color: #f8fafc;
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 24px;
            padding: 36px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #34d399;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 10px;
            color: #ffffff;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #059669;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.828m2.829 2.828L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0l2.828 2.828m-2.828-2.828L3 3m6.364 6.364a5 5 0 017.072 0" />
            </svg>
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>Koneksi internet Anda terputus. Namun Anda masih dapat membaca Mushaf Al-Qur'an yang telah tersimpan di memori perangkat Anda.</p>
        <button onclick="window.location.reload()" class="btn">
            <span>Muat Ulang Halaman</span>
        </button>
    </div>
</body>
</html>
